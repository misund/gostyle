name: PR title

on:
  # pull_request, not pull_request_target: runs are created for pushes made by
  # release-please with GITHUB_TOKEN, while pull_request_target runs were not.
  # The action only reads the PR title, so the read-only fork token is enough.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      # The PR title becomes the squash-merge commit, which release-please reads.
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
